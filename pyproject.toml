[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-handoff"
version = "0.1.1"
description = "An MCP server that offloads cheap work from your cloud LLM agent to a local Ollama model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Michael Tierney" }]
keywords = ["mcp", "model-context-protocol", "ollama", "llm", "claude", "local-llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Michael-WhiteCapData/ollama-handoff"
Repository = "https://github.com/Michael-WhiteCapData/ollama-handoff"
Issues = "https://github.com/Michael-WhiteCapData/ollama-handoff/issues"

[project.scripts]
ollama-handoff = "ollama_handoff.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_handoff"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
